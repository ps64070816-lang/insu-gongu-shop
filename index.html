<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>인수의 공구가게</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Malgun Gothic', sans-serif;
  }

  body {
    background-color: #f4f1ec;
    color: #333;
  }

  /* 헤더 (쇼핑몰 이름 + 소개) */
  header {
    background-color: #e8590c;
    color: white;
    text-align: center;
    padding: 20px;
  }

  header h1 {
    font-size: 28px;
    margin-bottom: 5px;
  }

  header p {
    font-size: 14px;
  }

  /* 메뉴 */
  nav {
    display: flex;
    justify-content: center;
    background-color: #2b2b2b;
  }

  nav a {
    color: white;
    text-decoration: none;
    padding: 15px 20px;
    font-size: 16px;
  }

  nav a:hover {
    background-color: #e8590c;
  }

  /* 배너 */
  .banner {
    background-color: #2b2b2b;
    color: white;
    text-align: center;
    padding: 60px 20px;
  }

  .banner h2 {
    font-size: 26px;
    margin-bottom: 20px;
  }

  .banner button {
    background-color: #e8590c;
    color: white;
    border: none;
    padding: 12px 24px;
    font-size: 16px;
    border-radius: 6px;
    cursor: pointer;
  }

  .banner button:hover {
    background-color: #c44a09;
  }

  /* 상품 목록 */
  .products {
    display: flex;
    justify-content: center;
    gap: 20px;
    padding: 40px 20px;
    flex-wrap: wrap;
  }

  .card {
    background-color: white;
    border: 1px solid #e0ddd6;
    border-radius: 10px;
    width: 220px;
    text-align: center;
    padding: 20px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.05);
  }

  .card .product-photo {
    width: 100%;
    height: 140px;
    object-fit: cover;
    border-radius: 8px;
    margin-bottom: 10px;
  }

  .card h3 {
    font-size: 18px;
    margin-bottom: 10px;
    color: #e8590c;
  }

  .card .old-price {
    text-decoration: line-through;
    color: #999;
    font-size: 14px;
  }

  .card .price {
    font-size: 20px;
    font-weight: bold;
    color: #2b2b2b;
  }

  /* 하단 연락처 */
  footer {
    background-color: #2b2b2b;
    color: white;
    text-align: center;
    padding: 20px;
    margin-top: 20px;
    font-size: 14px;
  }

  /* 페이지 안에서 뜨는 팝업 */
  .popup-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.5);
    justify-content: center;
    align-items: center;
    z-index: 1000;
  }

  .popup-overlay.active {
    display: flex;
  }

  .popup-box {
    background-color: white;
    padding: 30px;
    border-radius: 10px;
    max-width: 320px;
    text-align: center;
    position: fixed;
  }

  .popup-box p {
    white-space: pre-line;
    margin-bottom: 20px;
    color: #333;
  }

  .popup-box button {
    background-color: #e8590c;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 6px;
    cursor: pointer;
  }
</style>
</head>
<body>

  <!-- 상단: 쇼핑몰 이름 + 소개 -->
  <header>
    <h1>인수의 공구가게</h1>
    <p>튼튼하고 믿을 수 있는 공구, 인수의 공구가게</p>
  </header>

  <!-- 메뉴 4개 -->
  <nav>
    <a href="#" onclick="showStaticPopup('인수의 공구가게\n\n좋은 공구를 합리적인 가격에 보내드립니다.')">홈</a>
    <a href="#">전체상품</a>
    <a href="#">공지사항</a>
    <a href="#" onclick="showStaticPopup('문의 전화: 010-1234-5678')">문의하기</a>
  </nav>

  <!-- 큰 배너 -->
  <div class="banner">
    <h2>튼튼한 공구, 지금 바로 만나보세요!</h2>
    <button onclick="showStaticPopup('믿을 수 있는 공구를 준비했습니다! 곧 만나보세요 🔧')">상품 보러가기</button>
  </div>

  <!-- 상품 카드 5개 -->
  <div class="products">

    <div class="card">
      <img class="product-photo" src="https://images.pexels.com/photos/15827212/pexels-photo-15827212/free-photo-of-hammers-in-workshop.jpeg?auto=compress&cs=tinysrgb&w=400" alt="망치">
      <h3>망치</h3>
      <div class="old-price">15,000원</div>
      <div class="price">12,000원</div>
    </div>

    <div class="card">
      <img class="product-photo" src="https://images.pexels.com/photos/16720099/pexels-photo-16720099/free-photo-of-multi-screwdriver-set.jpeg?auto=compress&cs=tinysrgb&w=400" alt="드라이버 세트">
      <h3>드라이버 세트</h3>
      <div class="old-price">25,000원</div>
      <div class="price">19,900원</div>
    </div>

    <div class="card">
      <img class="product-photo" src="https://images.pexels.com/photos/1094767/pexels-photo-1094767.jpeg?auto=compress&cs=tinysrgb&w=400" alt="전동드릴">
      <h3>전동드릴</h3>
      <div class="old-price">89,000원</div>
      <div class="price">72,000원</div>
    </div>

    <div class="card">
      <img class="product-photo" src="https://images.pexels.com/photos/3143082/pexels-photo-3143082.jpeg?auto=compress&cs=tinysrgb&w=400" alt="줄자">
      <h3>줄자</h3>
      <div class="old-price">8,000원</div>
      <div class="price">5,900원</div>
    </div>

    <div class="card">
      <img class="product-photo" src="https://images.pexels.com/photos/16243260/pexels-photo-16243260/free-photo-of-wrenches-hanging-on-wall.jpeg?auto=compress&cs=tinysrgb&w=400" alt="렌치 세트">
      <h3>렌치 세트</h3>
      <div class="old-price">35,000원</div>
      <div class="price">28,000원</div>
    </div>

  </div>

  <!-- 맨 아래 연락처 -->
  <footer>
    <p>인수의 공구가게 | 대표: 인수 | 전화: 010-1234-5678</p>
    <p>주소: 경기도 어느 공업사 거리</p>
  </footer>

  <!-- 페이지 안에서 뜨는 팝업 -->
  <div class="popup-overlay" id="popup">
    <div class="popup-box">
      <p id="popup-text"></p>
      <button onclick="closePopup()">닫기</button>
    </div>
  </div>

  <script>
    function showStaticPopup(message) {
      const box = document.querySelector('.popup-box');
      document.getElementById('popup-text').innerText = message;
      document.getElementById('popup').classList.add('active');

      box.style.left = (window.innerWidth - box.offsetWidth) / 2 + 'px';
      box.style.top = (window.innerHeight - box.offsetHeight) / 2 + 'px';
    }

    function closePopup() {
      document.getElementById('popup').classList.remove('active');
    }
  </script>

</body>
</html>
